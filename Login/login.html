<!doctype html>
<html>
  <head>
    <title>Faça o Login</title>
    <meta charset="UTP-8" />
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="Logo-SFAI.jpeg" />
  </head>
  <body>
    <header>
      <div class="logo">SF<span>AI</span></div>
    </header>

    <main>
      <div>
        <form action="" method="post">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="Coloque o seu email" />
          <label for="senha">Senha:</label>
          <input type="password" id="senha" placeholder="Coloque a sua senha" />
          <button onclick="window.location.href = ''">Entrar</button>
        </form>
      </div>
    </main>
  </body>
</html>
