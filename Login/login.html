<!doctype html>
<html>
  <head>
    <title>Faça o Login</title>
    <meta charset="UTP-8" />
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="Logo-SFAI.jpeg" />
  </head>
  <body>
    <header>
      <div class="logo">SF<span>AI</span></div>
    </header>

    <main>
      <div>
        <form action="" method="post">
          <label for="email" class="label1">E-mail:</label>
          <input type="email" id="email" placeholder="Coloque o seu email" />
          <label for="senha" class="label2">Senha:</label>
          <input type="password" id="senha" placeholder="Coloque a sua senha" />
          <a href="senha.html" class="a2">Esqueci a Senha</a>
           <label for="Lembrar" class="label3">Lembrar-me da senha</label>
           <input type="checkbox" name="Lembrar" id="checkbox" class="checkbox">
          <button onclick="window.location.href = 'Layout.html'" type="submit">
            Entrar
          </button>
          <label for="" class="label4">Fazer login com</label>
          <select name="" id="">
            <option value="google">Google</option>
            <option value="anonimo">Anonimo</option>
          </select>
        </form>
      </div>
    </main>
  </body>
</html>
