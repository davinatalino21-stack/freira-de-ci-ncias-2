<!doctype html>
<html>
  <head>
    <title>Faça o Login</title>
    <meta charset="UTP-8" />
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="Logo-SFAI.jpeg" />
  </head>
  <body>
    <header>
      <div class="logo">SF<span>AI</span></div>
    </header>
    <main>
      <div>
        <form action="" method="post">
          <label for="email">E-mail:</label>
          <input type="email" id="email" placeholder="Informe o seu email" />
          <label for="senha">Senha:</label>
          <input type="password" id="senha" placeholder="Informe a sua senha" />
          <br>
          <a href="senha.html" class="senha">Esqueci a Senha</a>
          <br>
           <label for="Lembrar">Lembrar-me da senha</label>
           <br>
           <input type="checkbox" name="Lembrar" id="checkbox" class="checkbox">
          <button onclick="window.location.href = 'Layout.html'" type="submit">
            Entrar
          </button>
           <label for="" class="label1">Fazer login com:</label>
          <button>Google</button>
           <label for="" class="label2">Ou</label>
          <button>Anonimo</button>
           <label for="">Ainda Não fez Cadastro?</label>
           <button onclick="window.location.href = 'Cadastro.html'" type="button">Fazer o Cadastro</button>
        </form>
      </div>
    </main>
  </body>
</html>
