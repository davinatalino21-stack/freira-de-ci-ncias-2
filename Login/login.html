<!doctype html>
<html>
  <head>
    <title>Faça o Login</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../Theme/theme.js" defer></script>
    <link rel="stylesheet" href="../Theme/theme.css" />
    <link rel="stylesheet" href="login.css" />
    <link rel="icon" href="Logo-SFAI.jpeg" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="script.js"></script>
  </head>
  <body>
    <main class="auth-page">
      <div class="corpo-do-login">
        <div class="auth-forms">
          <section class="auth-panel login-panel is-active" data-panel="login">
            <form id="loginForm" novalidate>
              <label for="loginEmail" class="label1">E-mail:</label>
              <input type="email" id="loginEmail" name="email" placeholder="" />
              <div class="field-error" data-error-for="loginEmail"></div>

              <label for="loginSenha" class="label2">Senha:</label>
              <div class="senha-wrapper">
                <input
                  type="password"
                  id="loginSenha"
                  name="senha"
                  placeholder=""
                />
                <button
                  type="button"
                  class="toggle-senha"
                  aria-label="Mostrar senha"
                  title="Mostrar senha"
                >
                  <svg
                    class="icon-eye-open"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                    />
                  </svg>
                  <svg
                    class="icon-eye-closed"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    style="display: none"
                  >
                    <path
                      d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M9.2 6.2A11 11 0 0 1 12 5c7 0 10 7 10 7a18.4 18.4 0 0 1-3.6 4.4M6.7 8.7A18.3 18.3 0 0 0 2 12s3 7 10 7a11.4 11.4 0 0 0 4.2-.8"
                    />
                  </svg>
                </button>
              </div>
              <div class="field-error" data-error-for="loginSenha"></div>

              <a href="senha.html" class="a2">Esqueci a Senha</a>

              <button class="btn-entrar" type="submit">Entrar</button>
            </form>

            <div id="buttonDiv"></div>

            <div class="auth-switch">
              <a href="#" class="switch-link" data-target="cadastro"
                >Não possui conta? Cadastre-se</a
              >
            </div>
          </section>

          <section class="auth-panel cadastro-panel" data-panel="cadastro">
            <form id="cadastroForm" novalidate>
              <label for="cadastroNome" class="label1">Nome:</label>
              <input type="text" id="cadastroNome" name="nome" placeholder="" />
              <div class="field-error" data-error-for="cadastroNome"></div>

              <label for="cadastroEmail" class="label2">E-mail:</label>
              <input
                type="email"
                id="cadastroEmail"
                name="email"
                placeholder=""
              />
              <div class="field-error" data-error-for="cadastroEmail"></div>

              <label for="cadastroSenha" class="label2">Senha:</label>
              <div class="senha-wrapper">
                <input
                  type="password"
                  id="cadastroSenha"
                  name="senha"
                  placeholder=""
                />
                <button
                  type="button"
                  class="toggle-senha"
                  aria-label="Mostrar senha"
                  title="Mostrar senha"
                >
                  <svg
                    class="icon-eye-open"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                    />
                  </svg>
                  <svg
                    class="icon-eye-closed"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    style="display: none"
                  >
                    <path
                      d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M9.2 6.2A11 11 0 0 1 12 5c7 0 10 7 10 7a18.4 18.4 0 0 1-3.6 4.4M6.7 8.7A18.3 18.3 0 0 0 2 12s3 7 10 7a11.4 11.4 0 0 0 4.2-.8"
                    />
                  </svg>
                </button>
              </div>
              <div class="field-error" data-error-for="cadastroSenha"></div>

              <label for="confirmarSenha" class="label2"
                >Confirmar senha:</label
              >
              <div class="senha-wrapper">
                <input
                  type="password"
                  id="confirmarSenha"
                  name="confirmarSenha"
                  placeholder=""
                />
                <button
                  type="button"
                  class="toggle-senha"
                  aria-label="Mostrar senha"
                  title="Mostrar senha"
                >
                  <svg
                    class="icon-eye-open"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                  >
                    <path
                      d="M12 5c-7 0-10 7-10 7s3 7 10 7 10-7 10-7-3-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"
                    />
                  </svg>
                  <svg
                    class="icon-eye-closed"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    style="display: none"
                  >
                    <path
                      d="M3 3l18 18M10.6 10.6A3 3 0 0 0 13.4 13.4M9.2 6.2A11 11 0 0 1 12 5c7 0 10 7 10 7a18.4 18.4 0 0 1-3.6 4.4M6.7 8.7A18.3 18.3 0 0 0 2 12s3 7 10 7a11.4 11.4 0 0 0 4.2-.8"
                    />
                  </svg>
                </button>
              </div>
              <div class="field-error" data-error-for="confirmarSenha"></div>

              <button class="btn-entrar" type="submit">Criar conta</button>
            </form>

            <div class="auth-switch">
              <a href="#" class="switch-link" data-target="login"
                >Já possui conta? Entrar</a
              >
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
